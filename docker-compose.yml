services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: stockpulse-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stockpulse}
      POSTGRES_USER: ${POSTGRES_USER:-stockpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockpulse_secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockpulse -d stockpulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: stockpulse-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stockpulse-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-stockpulse}:${POSTGRES_PASSWORD:-stockpulse_secret}@db:5432/${POSTGRES_DB:-stockpulse}
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai-service:8000
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY}
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 3001
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: stockpulse-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      NEWS_API_KEY: ${NEWS_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://72.60.43.25:3001
    container_name: stockpulse-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://72.60.43.25:3001
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
